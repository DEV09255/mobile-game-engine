<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Skyline Merge Arena</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#07111e,#1a4d6d);font-family:Arial,sans-serif;color:#fff;min-height:100vh}.game{max-width:480px;margin:auto;min-height:100vh;background:linear-gradient(180deg,#0d2844,#123e5b);display:flex;flex-direction:column}.header{padding:18px 14px;text-align:center;border-bottom:2px solid #58d0ff}.header h1{margin:0 0 12px;font-size:26px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.stat{padding:8px 3px;background:#123b59;border:1px solid #58d0ff;border-radius:8px}.stat small{display:block;color:#9db5c9;font-size:9px;text-transform:uppercase}.stat b{font-size:17px;color:#58d0ff}.content{padding:12px;overflow:auto;flex:1}.card{background:#122d45;border:1px solid #2b6483;border-radius:12px;padding:13px;margin-bottom:12px}.title{font-size:12px;letter-spacing:1px;color:#58d0ff;font-weight:bold;margin-bottom:10px;text-transform:uppercase}.enemy{text-align:center;padding:16px;border-radius:10px;background:#123e5b}.enemy h2{margin:0 0 10px;color:#ffbf5f}.bar{height:20px;border-radius:10px;background:#07111e;border:1px solid #ff6b6b;overflow:hidden}.fill{height:100%;background:#4ae39c;display:flex;align-items:center;justify-content:center;color:#07111e;font-size:11px;font-weight:bold;transition:width .25s}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px}button{border:0;border-radius:8px;padding:12px 6px;font-weight:bold;cursor:pointer;color:#07111e}button:active{transform:scale(.95)}.blue{background:#58d0ff}.purple{background:#8d7dff;color:#fff}.gold{background:#ffbf5f}.units{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.unit{text-align:center;padding:10px 4px;background:#173e58;border-radius:8px;border:1px solid #2b6483}.unit b{display:block;color:#58d0ff;font-size:11px}.unit strong{color:#ffd166;font-size:21px}.log{font-size:11px;color:#9db5c9;max-height:110px;overflow:auto}.log div{padding:5px;border-left:2px solid #58d0ff;margin:4px 0;background:#0d2844}.offer{display:flex;justify-content:space-between;align-items:center;padding:9px;margin:6px 0;border-radius:8px;background:#173e58}.offer b{display:block;color:#58d0ff;font-size:12px}.offer small{color:#9db5c9}.offer button{padding:8px 10px;font-size:10px}.nav{padding:10px;background:#0d2844;border-top:1px solid #2b6483;display:grid;grid-template-columns:1fr 1fr;gap:8px}.shop{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:20px}.shop.open{display:flex}.modal{max-width:430px;width:100%;max-height:90vh;overflow:auto;background:#0d2844;border:2px solid #58d0ff;border-radius:14px;padding:16px}.modal h2{text-align:center;color:#58d0ff}.close{float:right;background:#ff6b6b;padding:6px 10px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#58d0ff;color:#07111e;padding:12px 18px;border-radius:8px;font-weight:bold}
</style>
</head>
<body><div class="game"><header class="header"><h1>⚔️ Skyline Merge</h1><div class="stats"><div class="stat"><small>Level</small><b id="level">1</b></div><div class="stat"><small>Coins</small><b id="coins">2500</b></div><div class="stat"><small>Gems</small><b id="gems">25</b></div><div class="stat"><small>Streak</small><b id="streak">x1</b></div></div></header><main class="content"><section class="card enemy"><div class="title">Current Battle</div><h2 id="enemy">Drone Scout</h2><div class="bar"><div id="hp" class="fill" style="width:100%">80/80</div></div><p id="power">Power: 12</p><div class="actions"><button class="blue" onclick="game.collect()">📦 Collect</button><button class="purple" onclick="game.merge()">🔄 Merge</button><button class="gold" onclick="game.battle()">⚔️ Battle</button></div></section><section class="card"><div class="title">Your Units</div><div id="units" class="units"></div></section><section class="card"><div class="title">Battle Log</div><div id="log" class="log"></div></section><section class="card"><div class="title">Featured Offers</div><div id="offers"></div></section></main><nav class="nav"><button class="blue" onclick="game.daily()">📅 Daily Reward</button><button class="gold" onclick="openShop()">💎 Shop</button></nav></div><div id="shop" class="shop"><div class="modal"><button class="close" onclick="closeShop()">✕</button><h2>Gem Shop</h2><div id="shopList"></div></div></div><script>
const units=[['Scout',12],['Ranger',18],['Guardian',28],['Sentinel',42],['Warden',64],['Titan',96]], enemies=[['Drone Scout',80,12],['Shadow Runner',120,18],['Fortress Tank',180,24],['Sky Warden',260,34],['Void Titan',340,46]], packs=[['Starter Bundle',500,'₹299','50k Coins'],['Hero Pack',1200,'₹639','Rare skin'],['Founder Pack',3000,'₹1499','Legendary title'],['Casual Path',800,'₹399','Cosmetic'],['Engaged Path',5000,'₹2499','Arena theme'],['Whale Path',12000,'₹5999','Legendary badge']];
const game={level:1,coins:2500,gems:25,streak:1,xp:0,next:100,inv:[2,1,0,0,0,0],enemy:0,logs:[],newPlayer:true,init(){this.newEnemy();this.render();this.shop();this.log('Welcome! Collect, merge and battle.')},newEnemy(){let e=enemies[this.enemy++%enemies.length];this.e=e;this.render()},log(x){this.logs.unshift(x);this.logs=this.logs.slice(0,8)},collect(){let r=Math.random(),t=r>.995?4:r>.97?3:r>.92?2:r>.82?1:0;this.inv[t]++;this.coins+=75;this.log('Collected '+units[t][0]+'! +75 Coins');this.merge(true);this.render()},merge(silent=false){for(let i=0;i<5;i++)if(this.inv[i]>=3){this.inv[i]-=3;this.inv[i+1]++;this.coins+=250*(i+1);this.log('Merged 3x '+units[i][0]+' into '+units[i+1][0]+'!');this.render();return}if(!silent)this.log('Collect three matching units to merge.');this.render()},battle(){let power=this.inv.reduce((a,n,i)=>a+n*(i+1)*units[i][1],0),chance=Math.min(.92,Math.max(.3,power*.6/(power*.6+this.e[2]*1.2)));if(Math.random()<chance){let c=300+this.level*15,x=25+this.level*2;this.coins+=c;this.xp+=x;this.log('Victory! +'+c+' Coins, +'+x+' XP');this.levelUp();this.newEnemy()}else{let p=150+this.level*8;this.coins=Math.max(0,this.coins-p);this.log('Defeat! -'+p+' Coins');this.newEnemy()}this.render()},levelUp(){while(this.xp>=this.next){this.xp-=this.next;this.next=Math.round(this.next*1.15);this.level++;if(this.level===50){this.gems+=100;this.log('Level 50 reward: +100 Gems')}if(this.level===100){this.gems+=300;this.log('Level 100 reward: +300 Gems')}if(this.level===1000){this.gems+=2000;this.log('Level 1000 reward: +2000 Gems')}}},daily(){let c=750+this.streak*120,g=Math.min(10,2+this.streak);this.coins+=c;this.gems+=g;this.streak++;this.log('Daily reward: +'+c+' Coins, +'+g+' Gems');this.render()},buy(g){let n=this.newPlayer?Math.round(g*1.2):g;this.gems+=n;this.coins+=100;this.log('Purchase demo: +'+n+' Gems (20% new-player bonus)');this.render();toast('+'+n+' Gems')},render(){document.getElementById('level').textContent=this.level;document.getElementById('coins').textContent=Math.floor(this.coins).toLocaleString('en-IN');document.getElementById('gems').textContent=this.gems;document.getElementById('streak').textContent='x'+this.streak;document.getElementById('enemy').textContent=this.e[0];document.getElementById('power').textContent='Power: '+this.e[2];document.getElementById('hp').textContent=this.e[1]+'/'+this.e[1];document.getElementById('units').innerHTML=units.map((u,i)=>'<div class="unit"><b>'+u[0]+'</b><strong>'+this.inv[i]+'</strong></div>').join('');document.getElementById('log').innerHTML=this.logs.map(x=>'<div>'+x+'</div>').join('')},shop(){document.getElementById('offers').innerHTML=packs.slice(0,3).map(p=>this.offer(p)).join('');document.getElementById('shopList').innerHTML=packs.map(p=>this.offer(p)).join('')},offer(p){return '<div class="offer"><div><b>'+p[0]+'</b><small>'+p[2]+' • '+p[1]+' Gems • '+p[3]+'</small></div><button class="gold" onclick="game.buy('+p[1]+')">Buy</button></div>'}};function openShop(){document.getElementById('shop').classList.add('open')}function closeShop(){document.getElementById('shop').classList.remove('open')}function toast(x){let t=document.createElement('div');t.className='toast';t.textContent=x;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}game.init();
</script></body></html>
